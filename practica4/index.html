<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="images/uteq.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 4</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <meta http-equiv="Cache-Control" content="no-cache, mustrevalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <style>
        #divmapa {
            height: 500px; 
            width: 100%;
        }
        .map-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .map-container .left {
            flex: 1;
        }
        .map-container .right {
            width: 400px;
            margin-left: 20px;
        }
    </style>
</head>

<body>    
    <div class="container">
        <h3><i class="fa fa-solid fa-earth fa-2x me-4"></i>Practica 4 - Google Maps API con eventos</h3>
        <div class="map-container">
            <div class="left">
                <div id="divmapa" class="border border-dark rounded mt-3" style="height: 450px; width: 100%;"></div>
                <h4 class="mt-2">Haz click para agregar un marcador</h4>
            </div>
            <div class="right">
                <div class="form-group" id="group-posiciones">
                    <select id="posiciones" class="form-select" size="12"> 
                    </select>
                </div>
                <div class="d-flex mt-3 justify-content-between">
                    <button type="button" class="btn btn-primary" id="btn-animar"> <i class="fa-solid fa-street-view"></i> Animar</button>
                    <button type="button" class="btn btn-danger" id="btn-eliminar"> <i class="fa-solid fa-times"></i> Eliminar</button>
                    <button type="button" class="btn btn-dark" id="btn-detener"> <i class="fa-solid fa-location-pin-lock"></i> Detener</button>
                </div>
            </div>
        </div>
    </div>
    <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=creamapa"></script>
    <script src="js/mensajes.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
